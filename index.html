<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Webpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #17221b;
            --muted: #526158;
            --accent: #d46a3a;
            --paper: #f7f3eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            line-height: 1.6;
        }

        header,
        main,
        footer {
            width: min(92%, 900px);
            margin: 0 auto;
        }

        header {
            padding: 4rem 0 2rem;
        }

        h1 {
            max-width: 650px;
            margin: 0;
            font-family: "Playfair Display", serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 1.05;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr);
            gap: 2rem;
            align-items: center;
            padding: 2rem 0 4rem;
        }

        main p {
            margin: 0;
            color: var(--muted);
            font-size: 1.15rem;
        }

        .feature-image {
            width: 100%;
            display: block;
            border-radius: 1rem;
            box-shadow: 0 1rem 2rem rgba(23, 34, 27, 0.14);
            transition: transform 300ms ease, filter 300ms ease, box-shadow 300ms ease;
        }

        .feature-image:hover {
            transform: scale(1.04) rotate(1deg);
            filter: saturate(1.25) contrast(1.05);
            box-shadow: 0 1.5rem 2.5rem rgba(23, 34, 27, 0.22);
        }

        footer {
            padding: 1.5rem 0;
            border-top: 1px solid rgba(23, 34, 27, 0.15);
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 620px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Webpage</h1>
    </header>

    <main>
        <p>This is a basic HTML webpage created for my assignment. Explore the page and hover over the image to see it transform.</p>
        <img class="feature-image" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Sunlit mountain landscape">
    </main>

    <footer>
        <p>&copy; 2026 My Webpage</p>
    </footer>

</body>
</html>
